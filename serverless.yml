service: kiyanaw-serverless

frameworkVersion: '3'

provider:
  name: aws
  runtime: nodejs20.x
  region: ${self:custom.amplify.region}
  stage: ${self:custom.amplify.envName}
  profile: ${self:custom.amplify.awsProfile}
  stackName: ${self:service}-${self:custom.amplify.envName}

  # Use Amplify's deployment bucket for consistency
  deploymentBucket:
    name: ${self:custom.amplify.deploymentBucket}

custom:
  # Amplify environment context (populated by scripts/serverless/get-amplify-env.js)
  amplify:
    envName: ${file(./scripts/serverless/amplify-env.json):envName, 'staging'}
    region: ${file(./scripts/serverless/amplify-env.json):region, 'us-east-1'}
    awsProfile: ${file(./scripts/serverless/amplify-env.json):awsProfile, 'default'}
    deploymentBucket: ${file(./scripts/serverless/amplify-env.json):deploymentBucket, ''}
    amplifyAppId: ${file(./scripts/serverless/amplify-env.json):amplifyAppId, ''}
    stackName: ${file(./scripts/serverless/amplify-env.json):stackName, ''}

  # VPC information (populated by scripts/serverless/get-vpc-info.js)
  vpc:
    vpcId: ${file(./scripts/serverless/vpc-info.json):vpcId}
    subnetIds: ${file(./scripts/serverless/vpc-info.json):subnetIds}
    subnet1: ${file(./scripts/serverless/vpc-info.json):subnet1}
    subnet2: ${file(./scripts/serverless/vpc-info.json):subnet2}
    securityGroupId: ${file(./scripts/serverless/vpc-info.json):securityGroupId}
    routeTableId: ${file(./scripts/serverless/vpc-info.json):routeTableId}

  # CloudFront CDN configuration for media streaming
  cloudfront:
    # Domain mapping by environment
    domain:
      staging: cdn.kiyanaw.dev
      production: cdn.kiyanaw.net
    # Parent hosted zone for DNS records
    hostedZone:
      staging: kiyanaw.dev
      production: kiyanaw.net
    # ACM certificate ARNs (stored in SSM Parameter Store after manual creation)
    certificateArn:
      staging: ${ssm:/kiyanaw/cloudfront/staging/certificate-arn, ''}
      production: ${ssm:/kiyanaw/cloudfront/production/certificate-arn, ''}
    # S3 bucket name (from Amplify outputs via amplify-env.json)
    s3BucketName: ${file(./scripts/serverless/amplify-env.json):transcriptionsBucketName, ''}

# No functions defined - this stack only manages infrastructure
functions: {}

resources:
  Description: |
    Serverless infrastructure for Kiyanaw Backend
    This stack creates VPC, EFS, and other infrastructure resources needed by Amplify Lambda functions.

  Conditions:
    # Route53 hosted zone for kiyanaw.net is in a different AWS account,
    # so we skip creating the DNS record for production and add it manually
    CreateRoute53Record:
      !Not [!Equals ['${self:custom.amplify.envName}', 'production']]

  Resources:
    # ==========================================
    # VPC S3 Endpoint
    # Required for Lambda functions in VPC to access S3 without going through NAT Gateway
    # Used by: createPeaksFile, processMedia
    # ==========================================
    VpcS3Endpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: ${self:custom.vpc.vpcId}
        ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
        RouteTableIds:
          - ${self:custom.vpc.routeTableId}
        VpcEndpointType: Gateway

    # ==========================================
    # VPC DynamoDB Endpoint
    # Required for Lambda functions in VPC to reach DynamoDB without NAT Gateway
    # Used by: processMedia (updates Media table status)
    # ==========================================
    VpcDynamoDBEndpoint:
      Type: AWS::EC2::VPCEndpoint
      Properties:
        VpcId: ${self:custom.vpc.vpcId}
        ServiceName: !Sub 'com.amazonaws.${AWS::Region}.dynamodb'
        RouteTableIds:
          - ${self:custom.vpc.routeTableId}
        VpcEndpointType: Gateway

    # ==========================================
    # EFS File System for createPeaksFile Lambda
    # Used for temporary storage when processing audio/video files
    # Mount path: /mnt/temp
    # ==========================================
    CreatePeaksFileEFS:
      Type: AWS::EFS::FileSystem
      Properties:
        FileSystemTags:
          - Key: Name
            Value: createPeaksFileFS-${self:custom.amplify.envName}
          - Key: Environment
            Value: ${self:custom.amplify.envName}
        PerformanceMode: generalPurpose
        ThroughputMode: bursting
        Encrypted: true

    # EFS Mount Targets (one per subnet - using first 2)
    CreatePeaksFileMountTarget1:
      Type: AWS::EFS::MountTarget
      Properties:
        FileSystemId: !Ref CreatePeaksFileEFS
        SubnetId: ${self:custom.vpc.subnet1}
        SecurityGroups:
          - ${self:custom.vpc.securityGroupId}

    CreatePeaksFileMountTarget2:
      Type: AWS::EFS::MountTarget
      Properties:
        FileSystemId: !Ref CreatePeaksFileEFS
        SubnetId: ${self:custom.vpc.subnet2}
        SecurityGroups:
          - ${self:custom.vpc.securityGroupId}

    # EFS Access Point for Lambda
    CreatePeaksFileAccessPoint:
      Type: AWS::EFS::AccessPoint
      Properties:
        FileSystemId: !Ref CreatePeaksFileEFS
        PosixUser:
          Uid: '1000'
          Gid: '1000'
        RootDirectory:
          CreationInfo:
            OwnerGid: '1000'
            OwnerUid: '1000'
            Permissions: '777'
          Path: '/temp'

    # ==========================================
    # CloudFront CDN for Media Streaming
    # Provides low-latency media delivery with signed URLs
    # Custom domains: cdn.kiyanaw.dev (staging), cdn.kiyanaw.net (production)
    # ==========================================

    # Origin Access Control for S3 (preferred over OAI)
    CloudFrontOAC:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: kiyanaw-transcriptions-oac-${self:custom.amplify.envName}
          Description: OAC for Kiyanaw transcriptions S3 bucket
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    # CloudFront Public Key for Signed URLs (environment-specific)
    CloudFrontPublicKey:
      Type: AWS::CloudFront::PublicKey
      Properties:
        PublicKeyConfig:
          Name: kiyanaw-signing-key-${self:custom.amplify.envName}
          CallerReference: kiyanaw-${self:custom.amplify.envName}-v1
          EncodedKey: ${file(./scripts/serverless/cloudfront-public-key-${self:custom.amplify.envName}.pem)}

    # CloudFront Key Group for Trusted Signers
    CloudFrontKeyGroup:
      Type: AWS::CloudFront::KeyGroup
      DependsOn: CloudFrontPublicKey
      Properties:
        KeyGroupConfig:
          Name: kiyanaw-signers-${self:custom.amplify.envName}
          Items:
            - !Ref CloudFrontPublicKey

    # CloudFront Distribution for Media CDN
    MediaCDNDistribution:
      Type: AWS::CloudFront::Distribution
      DependsOn:
        - CloudFrontOAC
        - CloudFrontKeyGroup
      Properties:
        DistributionConfig:
          Enabled: true
          Comment: Kiyanaw Media CDN - ${self:custom.amplify.envName}

          # Custom domain configuration
          Aliases:
            - ${self:custom.cloudfront.domain.${self:custom.amplify.envName}}
          ViewerCertificate:
            AcmCertificateArn: ${self:custom.cloudfront.certificateArn.${self:custom.amplify.envName}}
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021

          # S3 Origin configuration
          Origins:
            - Id: S3TranscriptionsBucket
              DomainName: ${self:custom.cloudfront.s3BucketName}.s3.${self:custom.amplify.region}.amazonaws.com
              S3OriginConfig:
                OriginAccessIdentity: ''
              OriginAccessControlId: !GetAtt CloudFrontOAC.Id

          DefaultCacheBehavior:
            TargetOriginId: S3TranscriptionsBucket
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            Compress: true

            # Signed URL requirement
            TrustedKeyGroups:
              - !Ref CloudFrontKeyGroup

            # Cache policy - CachingOptimized
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6

            # Origin request policy - CORS-S3Origin
            OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf

          # Performance settings
          PriceClass: PriceClass_100
          HttpVersion: http2and3

    # Route53 A Record for CDN Domain (alias to CloudFront)
    # Skipped for production - see Conditions above
    CDNDomainRecord:
      Type: AWS::Route53::RecordSet
      Condition: CreateRoute53Record
      DependsOn: MediaCDNDistribution
      Properties:
        HostedZoneName: ${self:custom.cloudfront.hostedZone.${self:custom.amplify.envName}}.
        Name: ${self:custom.cloudfront.domain.${self:custom.amplify.envName}}.
        Type: A
        AliasTarget:
          DNSName: !GetAtt MediaCDNDistribution.DomainName
          HostedZoneId: Z2FDTNDATAQYW2

    # S3 Bucket Policy for CloudFront OAC Access
    TranscriptionsBucketPolicyForCloudFront:
      Type: AWS::S3::BucketPolicy
      DependsOn: MediaCDNDistribution
      Properties:
        Bucket: ${self:custom.cloudfront.s3BucketName}
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Sid: AllowCloudFrontServicePrincipalReadOnly
              Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub 'arn:aws:s3:::${self:custom.cloudfront.s3BucketName}/*'
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${MediaCDNDistribution}'

  Outputs:
    # VPC Information
    DefaultVpcId:
      Description: Default VPC ID
      Value: ${self:custom.vpc.vpcId}
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-VpcId

    DefaultSecurityGroupId:
      Description: Default Security Group ID
      Value: ${self:custom.vpc.securityGroupId}
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-SecurityGroupId

    DefaultSubnet1:
      Description: Default VPC Subnet 1
      Value: ${self:custom.vpc.subnet1}
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-Subnet1

    DefaultSubnet2:
      Description: Default VPC Subnet 2
      Value: ${self:custom.vpc.subnet2}
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-Subnet2

    # S3 VPC Endpoint
    VpcS3EndpointId:
      Description: VPC S3 Gateway Endpoint ID
      Value: !Ref VpcS3Endpoint
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-S3EndpointId

    # createPeaksFile EFS Resources
    CreatePeaksFileEFSId:
      Description: EFS File System ID for createPeaksFile Lambda
      Value: !Ref CreatePeaksFileEFS
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CreatePeaksFileEFSId

    CreatePeaksFileEFSAccessPointArn:
      Description: EFS Access Point ARN for createPeaksFile Lambda (mount at /mnt/temp)
      Value: !GetAtt CreatePeaksFileAccessPoint.Arn
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CreatePeaksFileEFSAccessPointArn

    CreatePeaksFileEFSAccessPointId:
      Description: EFS Access Point ID for createPeaksFile Lambda
      Value: !Ref CreatePeaksFileAccessPoint
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CreatePeaksFileEFSAccessPointId

    # CloudFront CDN Outputs
    CloudFrontDistributionId:
      Description: CloudFront Distribution ID for media CDN
      Value: !Ref MediaCDNDistribution
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CloudFrontDistributionId

    CloudFrontDomainName:
      Description: CloudFront Distribution Domain Name
      Value: !GetAtt MediaCDNDistribution.DomainName
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CloudFrontDomainName

    CloudFrontPublicKeyId:
      Description: CloudFront Public Key ID for signing
      Value: !Ref CloudFrontPublicKey
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CloudFrontPublicKeyId

    CloudFrontKeyGroupId:
      Description: CloudFront Key Group ID
      Value: !Ref CloudFrontKeyGroup
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CloudFrontKeyGroupId

    CDNCustomDomain:
      Description: Custom CDN domain for media
      Value: ${self:custom.cloudfront.domain.${self:custom.amplify.envName}}
      Export:
        Name: ${self:service}-${self:custom.amplify.envName}-CDNCustomDomain
