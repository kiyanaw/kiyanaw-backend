name: Deploy and E2E Test

on:
  push:
    branches: [ "staging" ]
  pull_request:
    branches: [ "staging" ]
  release:
    types: [published]

env:
  NODE_VERSION: '22.x'
  AWS_REGION: 'us-east-1'

jobs:
  determine-environment:
    name: Determine Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
    steps:
      - name: Set environment
        id: env
        run: |
          if [ "${{ github.event_name }}" == "release" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          else
            echo "environment=staging" >> $GITHUB_OUTPUT
          fi

  deploy:
    name: Deploy to ${{ needs.determine-environment.outputs.environment }}
    runs-on: ubuntu-latest
    needs: determine-environment
    timeout-minutes: 30
    environment: ${{ needs.determine-environment.outputs.environment }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}
        
    - name: Install Amplify CLI
      run: npm install -g @aws-amplify/cli@latest
      
    - name: Configure Amplify
      run: |
        # Configure Amplify with the app ID
        amplify configure set --amplify ${{ secrets.AMPLIFY_APP_ID }}
        # Pull the project configuration for the specific environment
        amplify pull --appId ${{ secrets.AMPLIFY_APP_ID }} --envName ${{ vars.AMPLIFY_ENV }} --yes
        # Restore backend files from the current branch to ensure we deploy our changes
        git checkout HEAD -- amplify/backend/
        # Ensure we're on the correct environment
        amplify env checkout ${{ vars.AMPLIFY_ENV }} --yes
      env:
        AMPLIFY_APP_ID: ${{ secrets.AMPLIFY_APP_ID }}
        
    - name: Deploy backend (amplify push)
      run: amplify push --yes
      timeout-minutes: 20
      
    - name: Commit Amplify changes
      run: |
        # Check if there are any changes after amplify push
        if [ -n "$(git status --porcelain)" ]; then
          echo "Amplify made changes to files, committing them..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "chore: update Amplify configuration after deployment to ${{ vars.AMPLIFY_ENV }}"
          git push
        else
          echo "No changes detected after amplify push"
        fi
      
    - name: Build frontend
      run: npm run build
      
    - name: Deploy frontend (amplify publish)
      run: amplify publish --yes
      timeout-minutes: 10
      
    - name: Wait for deployment to complete
      run: |
        echo "Waiting for staging deployment to be ready..."
        sleep 30
        
    - name: Verify deployment
      run: |
        echo "Verifying ${{ needs.determine-environment.outputs.environment }} deployment at ${{ vars.BASE_URL }}"
        curl -f -s -o /dev/null ${{ vars.BASE_URL }} || {
          echo "${{ needs.determine-environment.outputs.environment }} deployment verification failed"
          exit 1
        }
        echo "✅ ${{ needs.determine-environment.outputs.environment }} deployment verified successfully"

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy]
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
      
    - name: Setup E2E environment
      run: npm run setup:e2e
      
    - name: Create test environment file
      run: |
        cat > .env << EOF
        # Playwright E2E Test Credentials
        PLAYWRIGHT_TEST_EMAIL=${{ secrets.PLAYWRIGHT_TEST_EMAIL }}
        PLAYWRIGHT_TEST_PASSWORD=${{ secrets.PLAYWRIGHT_TEST_PASSWORD }}
        PLAYWRIGHT_TEST_EMAIL_EDITOR=${{ secrets.PLAYWRIGHT_TEST_EMAIL_EDITOR }}
        PLAYWRIGHT_TEST_PASSWORD_EDITOR=${{ secrets.PLAYWRIGHT_TEST_PASSWORD_EDITOR }}
        PLAYWRIGHT_TEST_EMAIL_VIEWER=${{ secrets.PLAYWRIGHT_TEST_EMAIL_VIEWER }}
        PLAYWRIGHT_TEST_PASSWORD_VIEWER=${{ secrets.PLAYWRIGHT_TEST_PASSWORD_VIEWER }}
        PLAYWRIGHT_BASE_URL=${{ vars.BASE_URL }}
        EOF
        
    - name: Run E2E tests
      run: npm run test:e2e
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
        
    - name: Upload test results (JSON)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-json
        path: test-results/results.json
        retention-days: 30
        
    - name: Upload test results (JUnit)
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-junit
        path: test-results/results.xml
        retention-days: 30

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [determine-environment, deploy, e2e-tests]
    if: always()
    
    steps:
    - name: Deployment Status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ ${{ needs.determine-environment.outputs.environment }} deployment completed successfully"
        else
          echo "❌ ${{ needs.determine-environment.outputs.environment }} deployment failed"
        fi
        
    - name: E2E Test Status
      run: |
        if [ "${{ needs.e2e-tests.result }}" == "success" ]; then
          echo "✅ E2E tests passed"
        else
          echo "❌ E2E tests failed"
        fi
        
    - name: Overall Status
      run: |
        if [ "${{ needs.deploy.result }}" == "success" ] && [ "${{ needs.e2e-tests.result }}" == "success" ]; then
          echo "🎉 All checks passed! ${{ needs.determine-environment.outputs.environment }} deployment and E2E tests completed successfully."
        else
          echo "💥 Some checks failed. Please review the logs."
          exit 1
        fi
