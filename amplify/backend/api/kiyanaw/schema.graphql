type Transcription
  @model
  @auth(rules: [
    # 1) Allow IAM callers full CRUD (e.g. DataStore sync, Lambda functions)
    { allow: private, provider: identityPool, operations: [create, read, update, delete] }

    # 2) Allow any signed-in Cognito user to read public items
    { allow: private, operations: [read] }

    # 3) Owners (by author) via User Pools
    { allow: owner, ownerField: "author", operations: [create, read, update, delete] }

    # 4) List-based owners via User Pools
    { allow: owner, ownerField: "editors", operations: [read, update] }
    { allow: owner, ownerField: "viewers", operations: [read] }

    # 5) Static Admin group via User Pools
    { allow: groups, groups: ["Admins"], operations: [create, read, update, delete] }
  ]) {
  id: ID! @primaryKey
  author: String!
  coverage: Float
  dateLastUpdated: String!
  userLastUpdated: String
  length: Float
  issues: String
  comments: String
  tags: String
  source: String
  index: String
  title: String! @index(name: "ByTitle", queryField: "byTitle")
  type: String!
  isPrivate: Boolean
  isPublished: Boolean
  disableAnalyzer: Boolean
  # ACL fields (no field-level auth, handled in custom resolvers)
  editors: [String]
    @auth(rules: [
      { allow: owner, ownerField: "author", operations: [create, read, update] }
      { allow: groups, groups: ["Admins"], operations: [create, read, update] }
    ])
  viewers: [String]
    @auth(rules: [
      { allow: owner, ownerField: "author", operations: [create, read, update] }
      { allow: groups, groups: ["Admins"], operations: [create, read, update] }
    ])
  editorGroups: [String]
  viewerGroups: [String]
  regions: [Region] @hasMany(indexName: "ByTranscription", fields: ["id"])
  issueList: [Issue] @hasMany(indexName: "ByTranscription", fields: ["id"])
  contributors: [TranscriptionContributor] @hasMany(indexName: "byTranscription", fields: ["id"])
}

type Region
  @model
  @auth(rules: [
    { allow: private, provider: identityPool, operations: [create, read, update, delete] },
    { allow: private, operations: [read, update] }
  ]) {
  id: ID! @primaryKey
  start: Float!
  end: Float!
  regionText: String
  regionAnalysis: String
  isNote: Boolean
  translation: String
  dateLastUpdated: String!
  userLastUpdated: String!
  transcription: Transcription! @belongsTo(fields: ["transcriptionId"])
  transcriptionId: ID! @index(name: "ByTranscription")
}

type Issue
  @model
  @auth(rules: [
    { allow: private, provider: identityPool, operations: [create, read, update, delete] },
    { allow: private, operations: [read, update] }
  ]) {
  id: ID! @primaryKey
  text: String!
  owner: String! @index(name: "ByOwner")
  index: Int!
  resolved: Boolean
  type: String! @index(name: "ByType")
  comments: AWSJSON
  regionId: String!
  transcription: Transcription! @belongsTo(fields: ["transcriptionId"])
  transcriptionId: ID! @index(name: "ByTranscription")
}

type Contributor 
  @model
  @auth(rules: [
    { allow: private, provider: identityPool, operations: [create, read, update, delete] },
    { allow: private, operations: [read, update] }
  ]) {
  id: ID! @primaryKey
  email: String!
  username: String!
  transcriptions: [TranscriptionContributor] @hasMany(indexName: "byContributor", fields: ["id"])
}

type TranscriptionContributor
  @model
  @auth(rules: [
    { allow: private, provider: identityPool, operations: [create, read, update, delete] },
    { allow: private, operations: [read, update] }
  ]) {
  id: ID! @primaryKey
  transcriptionID: ID! @index(name: "byTranscription")
  contributorID: ID! @index(name: "byContributor")
  transcription: Transcription! @belongsTo(fields: ["transcriptionID"])
  contributor: Contributor! @belongsTo(fields: ["contributorID"])
}


