type Transcription
  @model
  @auth(
    rules: [
      # Base read authentication - any authenticated user can read
      # (custom resolvers will enforce isPrivate restrictions)
      { allow: private, operations: [read] }
      # Owner access for document creators
      { allow: owner, ownerField: "author" }
      # Admin access for system management  
      { allow: groups, groups: ["Admins"] }
      # Dynamic organization-based access (for isPrivate=true cases)
      { allow: groups, groupsField: "editorGroups" }
      { allow: groups, groupsField: "viewerGroups", operations: [read] }
    ]
  ) {
  id: ID! @primaryKey
  author: String!
  coverage: Float
  dateLastUpdated: String!
  userLastUpdated: String
  length: Float
  issues: String
  comments: String
  tags: String
  source: String
  index: String
  title: String! @index(name: "ByTitle", queryField: "byTitle")
  type: String!
  isPrivate: Boolean
  isPublished: Boolean
  disableAnalyzer: Boolean
  # ACL fields with restricted update access
  editors: [String] 
    @auth(rules: [
      { allow: owner, ownerField: "author", operations: [create, update] }
      { allow: groups, groups: ["Admins"], operations: [create, update] }
    ])
  viewers: [String]
    @auth(rules: [
      { allow: owner, ownerField: "author", operations: [create, update] }
      { allow: groups, groups: ["Admins"], operations: [create, update] }
    ])
  editorGroups: [String]
    @auth(rules: [
      { allow: owner, ownerField: "author", operations: [create, update] }
      { allow: groups, groups: ["Admins"], operations: [create, update] }
    ])
  viewerGroups: [String]
    @auth(rules: [
      { allow: owner, ownerField: "author", operations: [create, update] }
      { allow: groups, groups: ["Admins"], operations: [create, update] }
    ])
  regions: [Region] @hasMany(indexName: "ByTranscription", fields: ["id"])
  issueList: [Issue] @hasMany(indexName: "ByTranscription", fields: ["id"])
  contributors: [TranscriptionContributor] @hasMany(indexName: "byTranscription", fields: ["id"])
}

type Region
  @model
  @auth(
    rules: [
      # Base read authentication - access controlled via parent Transcription in custom resolvers
      { allow: private, operations: [read] }
      { allow: groups, groups: ["Admins"] }
    ]
  ) {
  id: ID! @primaryKey
  start: Float!
  end: Float!
  regionText: String
  regionAnalysis: String
  isNote: Boolean
  translation: String
  dateLastUpdated: String!
  userLastUpdated: String!
  transcription: Transcription! @belongsTo(fields: ["transcriptionId"])
  transcriptionId: ID! @index(name: "ByTranscription")
}

type Issue
  @model
  @auth(
    rules: [
      # Basic read access for authenticated users
      { allow: private, operations: [read] }
      { allow: groups, groups: ["Admins"] }
    ]
  ) {
  id: ID! @primaryKey
  text: String!
  owner: String! @index(name: "ByOwner")
  index: Int!
  resolved: Boolean
  type: String! @index(name: "ByType")
  comments: AWSJSON
  regionId: String!
  transcription: Transcription! @belongsTo(fields: ["transcriptionId"])
  transcriptionId: ID! @index(name: "ByTranscription")
}

type Contributor 
  @model
  @auth(
    rules: [
      # Basic read access for authenticated users
      { allow: private, operations: [read] }
      { allow: groups, groups: ["Admins"] }
    ]
  ) {
  id: ID! @primaryKey
  email: String!
  username: String!
  transcriptions: [TranscriptionContributor] @hasMany(indexName: "byContributor", fields: ["id"])
}

type TranscriptionContributor
  @model
  @auth(
    rules: [
      # Basic read access for authenticated users
      { allow: private, operations: [read] }
      { allow: groups, groups: ["Admins"] }
    ]
  ) {
  id: ID! @primaryKey
  transcriptionID: ID! @index(name: "byTranscription")
  contributorID: ID! @index(name: "byContributor")
  transcription: Transcription! @belongsTo(fields: ["transcriptionID"])
  contributor: Contributor! @belongsTo(fields: ["contributorID"])
}


