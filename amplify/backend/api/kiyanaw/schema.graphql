type Transcription
  @model
  @auth(rules: [
    # 1) Allow IAM callers full CRUD (e.g. DataStore sync, Lambda functions)
    { allow: private, provider: identityPool, operations: [create, read, update, delete] }

    # 2) Owners (by author) via User Pools
    { allow: owner, ownerField: "author", operations: [create, read, update, delete] }

    # 3) List-based owners via User Pools
    { allow: owner, ownerField: "editors", operations: [read, update] }
    { allow: owner, ownerField: "viewers", operations: [read] }

    # 4) Static Admin group via User Pools
    { allow: groups, groups: ["Admins"], operations: [create, read, update, delete] }
  ]) {
  id: ID! @primaryKey
  author: String! @index(name: "ByAuthor", queryField: "transcriptionsByAuthor") # UUID of the Cognito user
  authorFriendly: String! # Friendly identifier
  coverage: Float
  dateLastUpdated: String! @index(name: "ByDateLastUpdated", queryField: "transcriptionsByDate")
  userLastUpdated: String!
  length: Float
  issues: String
  comments: String # going to call this "Notes" in the app, comments moving to Comments
  commentCount: Int
  regionCount: Int
  issueCount: Int
  tags: String
  source: String
  index: String # deprecated field, use `lang`
  lang: String
  title: String! @index(name: "ByTitle", queryField: "byTitle")
  type: String!
  isPrivate: Boolean
  isPublished: Boolean
  publicIssues: Boolean
  disableAnalyzer: Boolean # deprecated field, use `lang`
  # ACL fields (no field-level auth, handled in custom resolvers)
  editors: [String]
  viewers: [String]
  editorGroups: [String]
  viewerGroups: [String]
  regions: [Region] @hasMany(indexName: "ByTranscription", fields: ["id"])
  issueList: [Issue] @hasMany(indexName: "ByTranscription", fields: ["id"])
  relatedComments: [Comment] @hasMany(indexName: "ByTranscription", fields: ["id"])
}

type Region
  @model
  @auth(rules: [
    # 1) Allow IAM callers full CRUD (e.g. DataStore sync, Lambda functions)
    { allow: private, provider: identityPool, operations: [create, read, update, delete] }
    
    # 2) Regions inherit access from parent Transcription
    # Users can only read regions - create/update requires explicit parent transcription access
    { allow: private, operations: [read] }
  ]) {
  id: ID! @primaryKey
  start: Float!
  end: Float!
  regionText: String
  regionAnalysis: [String]
  isNote: Boolean # deprecated field, notes moving into Comments
  commentCount: Int
  translation: String
  dateLastUpdated: String!
  userLastUpdated: String!
  transcription: Transcription! @belongsTo(fields: ["transcriptionId"])
  transcriptionId: ID! @index(name: "ByTranscription", queryField: "regionsByTranscription")
}

type Issue
  @model
  @auth(rules: [
    # 1) Allow IAM callers full CRUD (e.g. DataStore sync, Lambda functions)
    { allow: private, provider: identityPool, operations: [create, read, update, delete] }
    
    # 2) Owners (issue creators) can manage their own issues
    { allow: owner, ownerField: "owner", operations: [create, read, update, delete] }
    
    # 3) Inherit access from parent transcription - users with transcription access can read/update issues
    { allow: private, operations: [read, update] }
    
    # 4) Admins can manage all issues
    { allow: groups, groups: ["Admins"], operations: [create, read, update, delete] }
  ]) {
  id: ID! @primaryKey
  text: String!
  owner: String! @index(name: "ByOwner", queryField: "issuesByOwner")
  ownerFriendly: String!
  index: Int!
  resolved: Boolean
  type: String! @index(name: "ByType", queryField: "issuesByType")
  dateLastUpdated: String!
  userLastUpdated: String!
  comments: AWSJSON # deprecated field, comments moving to Comment field
  commentCount: Int
  regionId: String! @index(name: "ByRegion", queryField: "issuesByRegion")
  transcription: Transcription! @belongsTo(fields: ["transcriptionId"])
  transcriptionId: ID! @index(name: "ByTranscription", queryField: "issuesByTranscription")
}

type Invite
  @model
  @auth(rules: [
    # 1) Allow IAM callers full CRUD (e.g. DataStore sync, Lambda functions)
    { allow: private, provider: identityPool, operations: [create, read, update, delete] }
    
    # 2) Owners (who sent the invite) can manage their invites
    { allow: owner, ownerField: "invitedBy", operations: [create, read, update, delete] }
    
    # 3) Allow invited user to read their own invites by email
    { allow: owner, ownerField: "email", operations: [read, update] }
    
    # 4) Admins can manage all invites
    { allow: groups, groups: ["Admins"], operations: [create, read, update, delete] }
  ]) {
  id: ID! @primaryKey
  email: String! @index(name: "ByEmail", queryField: "invitesByEmail") @index(name: "ByEmailCreatedAt", queryField: "invitesByEmailCreatedAt", sortKeyFields: ["createdAt"])
  status: String!
  permissionLevel: String! # "viewer", "editor"
  expiresAt: String!
  invitedBy: String!
  invitedByFriendly: String! # Email/friendly identifier of inviter
  createdAt: String!
  acceptedAt: String
  transcriptionId: ID! @index(name: "ByTranscription", queryField: "invitesByTranscription")
  transcriptionTitle: String! # Title of the transcription being shared
}

type Comment
  @model
  @auth(rules: [
    # 1) Allow IAM callers full CRUD (e.g. DataStore sync, Lambda functions)
    { allow: private, provider: identityPool, operations: [create, read, update, delete] }
    
    # 2) Owners (comment authors) can manage their comments
    { allow: owner, ownerField: "author", operations: [create, read, update, delete] }
    
    # 3) Inherit access from parent transcription - users with access can read comments
    { allow: private, operations: [read] }
    
    # 4) Admins can manage all comments
    { allow: groups, groups: ["Admins"], operations: [create, read, update, delete] }
  ]) {
  id: ID! @primaryKey
  
  # Content fields
  text: String!
  # User-based indexing for "my comments" across transcriptions
  author: String! @index(name: "ByAuthor", queryField: "commentsByAuthor", sortKeyFields: ["createdAt"])
  authorFriendly: String! # Friendly identifier (email/username)
  
  # Timestamp fields
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  
  # Parent references - transcriptionId is ALWAYS present for efficient querying
  transcriptionId: ID! @index(name: "ByTranscription", queryField: "commentsByTranscription")
  transcription: Transcription! @belongsTo(fields: ["transcriptionId"])
  
  # Entity reference within the transcription
  entityType: String! # "region", "issue", "transcription" (for transcription-level comments)
  entityId: String! # ID of the specific entity (regionId, issueId, or transcriptionId)
  
  # Threading support for nested replies
  parentCommentId: ID @index(name: "ByParentComment", queryField: "commentsByParentComment")
  parentComment: Comment @belongsTo(fields: ["parentCommentId"])
  replies: [Comment] @hasMany(indexName: "ByParentComment", fields: ["id"])

  # Optional extensible metadata
  metadata: AWSJSON
}
